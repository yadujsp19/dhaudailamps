<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Society Accounts | LAMPS Dhaurai</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { 
            --brand: #6366f1; 
            --primary: #0f172a; 
            --secondary: #64748b;
            --bg: #f1f5f9; 
            --white: #ffffff;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif; background: var(--bg); padding: 20px; color: var(--primary); }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: var(--white); border-radius: 16px; padding: 25px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; background: white; padding: 8px; border-radius: 14px; margin-bottom: 25px; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; background: transparent; color: var(--secondary); transition: 0.3s; }
        .tab-btn.active { background: var(--brand); color: white; }
        h3 { display: flex; align-items: center; gap: 10px; font-size: 18px; margin-bottom: 20px; }
        h3::before { content: ''; width: 4px; height: 20px; background: var(--brand); border-radius: 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; outline: none; }
        .v-table-wrap { border-radius: 12px; border: 1px solid var(--border); overflow: hidden; margin: 15px 0; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #f8fafc; padding: 12px; font-size: 11px; color: var(--secondary); text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 10px; border-top: 1px solid #f1f5f9; text-align: center; font-size: 13px; }
        .neg-bal { color: var(--danger); font-weight: bold; }
        .btn { padding: 10px 18px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
        .btn-p { background: var(--brand); color: white; }
        .btn-s { background: var(--success); color: white; }
        .action-btns { display: flex; gap: 5px; justify-content: center; }
        .btn-icon { background: none; border: none; cursor: pointer; font-size: 16px; }

        #print-area { display: none; }
        @media print {
            .no-print { display: none !important; }
            #print-area { display: block !important; background: white; }
            .copy-section { border-bottom: 1px dashed #000; padding: 5mm 2mm; page-break-inside: avoid; background: white; }
            .copy-section:last-child { border-bottom: none; }
            .print-table { width: 100%; border-collapse: collapse; margin: 5px 0; border: 1.5px solid #000; }
            .print-table th, .print-table td { border: 1px solid #000; padding: 4px; text-align: center; font-size: 12px; color: black; }
            .print-header { text-align: center; margin-bottom: 5px; }
            .dotted-line { border-bottom: 1px dotted #000; padding: 0 5px; }
        }
    </style>
</head>
<body>

<div class="container no-print">
    <div class="card" style="display: flex; gap: 15px; align-items: center; padding: 15px;">
        <div style="flex:1;"><label style="font-size:11px; font-weight:700;">📅 डे-बुक तिथि</label>
        <input type="date" id="db-date" onchange="loadLogs()"></div>
        <div style="flex:2;">
            <label style="font-size:11px; font-weight:700;">➕ नया खाता जोड़ें</label>
            <div style="display:flex; gap:5px;">
                <input type="text" id="new-acc-name" placeholder="खाता नाम">
                <select id="new-acc-group" style="width:150px;">
                    <option value="Bank Accounts">Bank Accounts</option>
                    <option value="Loans and Advance">Loans and Advance</option>
                    <option value="Sundry Creditors">Sundry Creditors</option>
                    <option value="Sundry Debtors">Sundry Debtors</option>
                    <option value="Income">Income</option>
                    <option value="Expenses">Expenses</option>
                    <option value="Deposits">Deposits</option>
                    <option value="Liability">Liability</option>
                </select>
                <button class="btn btn-s" onclick="addNewAccount()">जोड़ें</button>
            </div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-R" onclick="switchTab('RECEIPT')">📥 प्राप्ति</button>
        <button class="tab-btn" id="tab-P" onclick="switchTab('PAYMENT')">📤 भुगतान</button>
        <button class="tab-btn" id="tab-J" onclick="switchTab('JOURNAL')">📒 जनरल</button>
    </div>

    <div class="card" id="main-entry-card">
        <h3 id="form-title">प्राप्ति व्हाउचर</h3>

        <div id="std-header" style="display:flex; gap:20px; margin-bottom:20px;">
            <div style="flex:1"><label>दिनांक</label><input type="date" id="std-date"></div>
            <div style="flex:2"><label>विवरण (Narration)</label><input type="text" id="v-desc" placeholder="विवरण..."></div>
        </div>

        <div class="v-table-wrap">
            <table id="entry-table">
                <thead><tr><th>नामे (Debit)</th><th>जमा (Credit)</th><th width="150">राशि</th><th width="50"></th></tr></thead>
                <tbody id="entry-body"></tbody>
            </table>
        </div>
        <button class="btn btn-p" onclick="addRow()">➕ Row</button>
        <button class="btn btn-s" id="save-voucher-btn" style="float:right;" onclick="saveVoucher()">💾 सुरक्षित करें</button>
        <div style="clear:both; margin-top:30px; border-top:2px solid var(--border); padding-top:20px;">
            <h3>📜 हालिया व्हाउचर एवं रिपोर्ट</h3>
            <div class="v-table-wrap">
                <table>
                    <thead><tr><th>दिनांक</th><th>विवरण</th><th>नामे</th><th>जमा</th><th>राशि</th><th>Balance</th><th>Action</th></tr></thead>
                    <tbody id="log-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="print-area"><div id="print-content"></div></div>

<script>
    const firebaseConfig = { databaseURL: "https://societydb-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentType = 'RECEIPT', allAccounts = [], editingVoucherKey = null, balances = {};
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('db-date').value = today;
    document.querySelectorAll('input[type="date"]').forEach(i => i.value = today);

    async function loadAccounts() {
        const snap = await db.ref('lamps/chart_of_accounts').once('value');
        allAccounts = [{ name: "नगद खाता", group: "Cash" }];
        if(snap.exists()) Object.values(snap.val()).forEach(a => allAccounts.push(a));
        calculateBalances().then(() => { addRow(); loadLogs(); });
    }

    async function calculateBalances() {
        const snap = await db.ref('lamps/vouchers').once('value');
        balances = {}; allAccounts.forEach(a => balances[a.name] = 0);
        if(snap.exists()){
            Object.values(snap.val()).forEach(v => {
                if(v.entries) v.entries.forEach(e => {
                    balances[e.dr] = (balances[e.dr] || 0) + e.amt;
                    balances[e.cr] = (balances[e.cr] || 0) - e.amt;
                });
            });
        }
    }

    function addRow() {
        const tbody = document.getElementById('entry-body');
        const tr = document.createElement('tr');
        let options = `<option value="">--चुनें--</option>`;
        allAccounts.forEach(a => options += `<option value="${a.name}">${a.name}</option>`);
        tr.innerHTML = `<td><select class="row-dr">${options}</select></td><td><select class="row-cr">${options}</select></td><td><input type="number" class="row-amt" placeholder="0.00"></td><td><button class="btn-icon" onclick="this.parentElement.parentElement.remove()">✖</button></td>`;
        tbody.appendChild(tr);
    }

    function switchTab(t) {
        currentType = t; editingVoucherKey = null;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + t.charAt(0)).classList.add('active');
        document.getElementById('form-title').innerText = t === 'JOURNAL' ? 'जर्नल व्हाउचर' : (t === 'RECEIPT' ? 'प्राप्ति व्हाउचर' : 'भुगतान व्हाउचर');
        document.getElementById('entry-body').innerHTML = ""; addRow(); loadLogs();
    }

    async function addNewAccount() {
        const name = document.getElementById('new-acc-name').value;
        const group = document.getElementById('new-acc-group').value;
        if(name) await db.ref('lamps/chart_of_accounts').push({ name, group });
        location.reload();
    }

    async function saveVoucher() {
        const date = document.getElementById('std-date').value;
        const mainDesc = document.getElementById('v-desc').value;
        const rows = document.querySelectorAll('#entry-body tr');
        let entries = [], total = 0;
        rows.forEach(r => {
            const dr = r.querySelector('.row-dr').value, cr = r.querySelector('.row-cr').value, amt = parseFloat(r.querySelector('.row-amt').value) || 0;
            if(dr && cr && amt > 0) { entries.push({ dr, cr, amt }); total += amt; }
        });
        if(!entries.length || !mainDesc) return swal("Error", "विवरण और एंट्री भरें", "error");
        
        const vData = { type: currentType, date, mainDesc, totalAmt: total, entries, ts: Date.now() };
        if(editingVoucherKey) await db.ref('lamps/vouchers/' + editingVoucherKey).set(vData);
        else await db.ref('lamps/vouchers').push(vData);
        swal("सफलता", "डेटा सुरक्षित", "success").then(() => location.reload());
    }

    function numberToWords(num) {
        const ones = ['', 'एक', 'दो', 'तीन', 'चार', 'पाँच', 'छह', 'सात', 'आठ', 'नौ', 'दस', 'ग्यारह', 'बारह', 'तेरह', 'चौदह', 'पंद्रह', 'सोलह', 'सत्रह', 'अठारह', 'उन्नीस'];
        const tens = ['', '', 'बीस', 'तीस', 'चालीस', 'पचास', 'साठ', 'सत्तर', 'अस्सी', 'नब्बे'];
        const format = (n) => {
            if (n < 20) return ones[n];
            if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 !== 0 ? ' ' + ones[n % 10] : '');
            if (n < 1000) return ones[Math.floor(n / 100)] + ' सौ ' + (n % 100 !== 0 ? format(n % 100) : '');
            if (n < 100000) return format(Math.floor(n / 1000)) + ' हजार ' + (n % 1000 !== 0 ? format(n % 1000) : '');
            if (n < 10000000) return format(Math.floor(n / 100000)) + ' लाख ' + (n % 100000 !== 0 ? format(n % 100000) : '');
            return n;
        };
        return format(Math.floor(num)) + ' रुपये मात्र';
    }

    function printVoucher(v) {
        const container = document.getElementById('print-content');
        container.innerHTML = "";
        let printDate = v.date;
        if(v.date.includes("-")) {
            let parts = v.date.split("-");
            printDate = parts[2] + "/" + parts[1] + "/" + parts[0];
        }
        const labels = ["समिति प्रति (Office)", "बैंक प्रति (Bank)", "पक्षकार प्रति (Farmer)"];
        const words = numberToWords(v.totalAmt);
        const headerTitle = v.type === 'JOURNAL' ? 'जर्नल व्हाउचर' : `नगद / ${v.type} व्हाउचर`;
        labels.forEach(lbl => {
            let rowH = v.entries.map((e, i) => `
                <tr><td>${(i*2)+1}</td><td style="text-align:left;">${e.dr}</td><td></td><td>${e.amt.toFixed(2)}</td><td></td></tr>
                <tr><td>${(i*2)+2}</td><td style="text-align:left; padding-left:15px;">${e.cr}</td><td></td><td></td><td>${e.amt.toFixed(2)}</td></tr>
            `).join('');
            container.innerHTML += `<div class="copy-section">
                <div style="text-align:right; font-size:9px; font-weight:bold;">${lbl}</div>
                <div class="print-header">
                    <div style="font-weight:bold; font-size:13px;">${headerTitle}</div>
                    <div style="font-size:16px; font-weight:bold; text-decoration:underline;">आ.जा. से. सह. समिति मर्या. धौड़ाई</div>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:bold; margin-bottom:5px;">
                    <div>प्र.क. सं. <span class="dotted-line">AR/NPR/24</span></div>
                    <div>दिनांक: <span class="dotted-line">${printDate}</span></div>
                </div>
                <table class="print-table">
                    <thead><tr><th width="10%">क्र.</th><th width="45%">खाते का नाम</th><th width="15%">पृष्ठ सं.</th><th width="15%">नामे (रु.)</th><th width="15%">जमा (रु.)</th></tr></thead>
                    <tbody>${rowH}<tr style="font-weight:bold; background:#eee;"><td colspan="3" style="text-align:right;">कुल योग (Total)</td><td>${v.totalAmt.toFixed(2)}</td><td>${v.totalAmt.toFixed(2)}</td></tr></tbody>
                </table>
                <div style="font-size:11px; line-height:1.6;">
                    <div><b>विवरण:</b> <span class="dotted-line" style="min-width:80%; display:inline-block;">${v.mainDesc}</span></div>
                    <div><b>शब्दों में:</b> <span class="dotted-line" style="min-width:70%; display:inline-block;">${words}</span></div>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:20px; font-weight:bold; font-size:10px;">
                    <div style="text-align:center;">-----------------------<br>प्रबंधक</div>
                    <div style="text-align:center;">-----------------------<br>कैशियर</div>
                    <div style="text-align:center;">-----------------------<br>हस्ताक्षर</div>
                </div>
            </div>`;
        });
        window.print();
    }

    async function loadLogs() {
        const date = document.getElementById('db-date').value;
        const snap = await db.ref('lamps/vouchers').once('value');
        const body = document.getElementById('log-body'); body.innerHTML = "";
        if(!snap.exists()) return;
        let runningBalances = {}; allAccounts.forEach(a => runningBalances[a.name] = 0);
        Object.entries(snap.val()).forEach(([key, v]) => {
            if(v.entries) v.entries.forEach(e => {
                runningBalances[e.dr] = (runningBalances[e.dr] || 0) + e.amt;
                runningBalances[e.cr] = (runningBalances[e.cr] || 0) - e.amt;
            });
            if(v.date === date && v.type === currentType) {
                v.entries.forEach(e => {
                    const bal = runningBalances[e.dr] || 0;
                    body.innerHTML += `<tr><td>${v.date}</td><td style="text-align:left;">${v.mainDesc}</td><td>${e.dr}</td><td>${e.cr}</td><td>${e.amt.toFixed(2)}</td><td class="${bal < 0 ? 'neg-bal' : ''}">${bal.toFixed(2)}</td><td class="action-btns"><button class="btn-icon" onclick='printVoucher(${JSON.stringify(v)})'>🖨️</button><button class="btn-icon" onclick='editVoucher("${key}", ${JSON.stringify(v)})'>✏️</button><button class="btn-icon" style="color:red;" onclick='deleteVoucher("${key}")'>🗑️</button></td></tr>`;
                });
            }
        });
    }

    function editVoucher(key, v) {
        editingVoucherKey = key;
        document.getElementById('std-date').value = v.date; 
        document.getElementById('v-desc').value = v.mainDesc;
        const tbody = document.getElementById('entry-body'); tbody.innerHTML = "";
        v.entries.forEach(e => {
            addRow(); const row = tbody.lastElementChild;
            row.querySelector('.row-dr').value = e.dr; row.querySelector('.row-cr').value = e.cr; row.querySelector('.row-amt').value = e.amt;
        });
        window.scrollTo(0, 0);
    }

    async function deleteVoucher(key) {
        swal({ title: "डिलीट?", icon: "warning", buttons: true }).then(async (ok) => {
            if(ok) { await db.ref('lamps/vouchers/' + key).remove(); location.reload(); }
        });
    }

    window.onload = loadAccounts;
</script>
</body>
</html>
