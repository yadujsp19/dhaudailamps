<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice Management | Admin</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <style>
        :root { --brand: #6366f1; --dark: #0f172a; --bg: #f1f5f9; --success: #10b981; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { color: var(--dark); border-left: 5px solid var(--brand); padding-left: 15px; margin-bottom: 20px; }
        
        textarea { width: 100%; height: 100px; padding: 15px; border: 2px solid #ddd; border-radius: 10px; outline: none; font-size: 15px; margin-bottom: 15px; box-sizing: border-box; }
        .upload-area { border: 2px dashed #cbd5e1; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 15px; background: #f8fafc; cursor: pointer; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .btn-post { background: var(--brand); width: 100%; font-size: 16px; }
        .btn-cancel { background: #64748b; margin-top: 10px; width: 100%; display: none; }
        
        .notice-item { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; border-left: 5px solid var(--brand); position: relative; }
        .notice-date { font-size: 11px; color: #64748b; margin-bottom: 8px; }
        .notice-msg { font-size: 16px; line-height: 1.6; color: var(--dark); margin-bottom: 10px; }
        .actions { display: flex; gap: 10px; margin-top: 10px; }
        .attach-link { display: inline-flex; align-items: center; gap: 8px; background: #eef2ff; color: var(--brand); padding: 8px 15px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; }
        
        .edit-btn { background: #f59e0b; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .del-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        
        #edit-indicator { display: none; background: #fffbeb; color: #92400e; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; font-weight: bold; border: 1px solid #fde68a; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 id="form-title">📢 नया नोटिस जारी करें</h2>
        
        <div id="edit-indicator">⚠️ आप अभी एक पुराने नोटिस को एडिट कर रहे हैं।</div>

        <textarea id="n-msg" placeholder="नोटिस का विवरण यहाँ लिखें..."></textarea>
        
        <div class="upload-area" onclick="document.getElementById('n-file').click()">
            <p id="file-label">📄 फाइल/फोटो अटैच करें (Optional)</p>
            <input type="file" id="n-file" hidden onchange="handleFile(this)">
            <small style="color: #94a3b8;">Max size: 1MB (PDF या Image)</small>
        </div>

        <button class="btn btn-post" id="main-btn" onclick="uploadNotice()">🚀 नोटिस पोस्ट करें</button>
        <button class="btn btn-cancel" id="cancel-btn" onclick="resetForm()">✖ एडिट रद्द करें</button>
    </div>

    <div id="notice-list">
        <h3 style="color:#64748b; text-align:center;">लोड हो रहा है...</h3>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://societydb-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let base64File = "";
    let fileName = "";
    let editId = null; // Edit mode track karne ke liye

    // File handling
    function handleFile(input) {
        const file = input.files[0];
        if (!file) return;
        if (file.size > 1048576) { 
            swal("Error", "फाइल का साइज 1MB से कम होना चाहिए", "error");
            input.value = "";
            return;
        }
        fileName = file.name;
        const reader = new FileReader();
        reader.onload = function(e) {
            base64File = e.target.result;
            document.getElementById('file-label').innerText = "✅ चयनित: " + fileName;
            document.getElementById('file-label').style.color = "#10b981";
        };
        reader.readAsDataURL(file);
    }

    // Post ya Update Notice
    function uploadNotice() {
        const msg = document.getElementById('n-msg').value.trim();
        if (!msg) return swal("Error", "कृपया नोटिस विवरण लिखें", "warning");

        const data = {
            msg: msg,
            date: editId ? document.getElementById('last-date').value : new Date().toLocaleString('hi-IN'),
            fileData: base64File, 
            fileName: fileName,
            ts: editId ? document.getElementById('last-ts').value : Date.now()
        };

        swal({ title: editId ? "अपडेट हो रहा है..." : "पोस्ट हो रहा है...", buttons: false });

        const ref = editId ? db.ref('lamps/notices/' + editId) : db.ref('lamps/notices').push();
        
        ref.set(data).then(() => {
            swal("सफल", editId ? "नोटिस अपडेट कर दिया गया है" : "नया नोटिस पोस्ट कर दिया गया है", "success");
            resetForm();
        });
    }

    // Edit ke liye data form mein bharna
    function editNotice(id, msg, fData, fName, date, ts) {
        editId = id;
        document.getElementById('n-msg').value = msg;
        base64File = fData || "";
        fileName = fName || "";
        
        // Hidden fields for original timing (optional, keeping original date)
        const hiddenDate = document.createElement('input');
        hiddenDate.type = 'hidden'; hiddenDate.id = 'last-date'; hiddenDate.value = date;
        const hiddenTs = document.createElement('input');
        hiddenTs.type = 'hidden'; hiddenTs.id = 'last-ts'; hiddenTs.value = ts;
        document.body.appendChild(hiddenDate);
        document.body.appendChild(hiddenTs);

        document.getElementById('form-title').innerText = "📝 नोटिस एडिट करें";
        document.getElementById('main-btn').innerText = "🔄 अपडेट सुरक्षित करें";
        document.getElementById('main-btn').style.background = "#f59e0b";
        document.getElementById('edit-indicator').style.display = "block";
        document.getElementById('cancel-btn').style.display = "block";
        
        if(fName) {
            document.getElementById('file-label').innerText = "✅ मौजूदा फाइल: " + fName;
            document.getElementById('file-label').style.color = "#10b981";
        } else {
            document.getElementById('file-label').innerText = "📄 फाइल/फोटो अटैच करें (Optional)";
        }
        
        window.scrollTo(0,0);
    }

    // Form reset karna
    function resetForm() {
        editId = null;
        base64File = "";
        fileName = "";
        document.getElementById('n-msg').value = "";
        document.getElementById('n-file').value = "";
        document.getElementById('form-title').innerText = "📢 नया नोटिस जारी करें";
        document.getElementById('main-btn').innerText = "🚀 नोटिस पोस्ट करें";
        document.getElementById('main-btn').style.background = "#6366f1";
        document.getElementById('edit-indicator').style.display = "none";
        document.getElementById('cancel-btn').style.display = "none";
        document.getElementById('file-label').innerText = "📄 फाइल/फोटो अटैच करें (Optional)";
        document.getElementById('file-label').style.color = "#64748b";
        
        if(document.getElementById('last-date')) document.getElementById('last-date').remove();
        if(document.getElementById('last-ts')) document.getElementById('last-ts').remove();
    }

    // Delete notice
    function deleteNotice(id) {
        swal({
            title: "क्या आप पक्का हैं?",
            text: "डिलीट करने के बाद यह वापस नहीं आएगा!",
            icon: "warning",
            buttons: ["नहीं", "हाँ, डिलीट करें"],
            dangerMode: true,
        }).then((willDelete) => {
            if (willDelete) {
                db.ref('lamps/notices/' + id).remove();
            }
        });
    }

    // Real-time Notice Load
    db.ref('lamps/notices').on('value', snap => {
        const container = document.getElementById('notice-list');
        container.innerHTML = "<h3>📜 पुराने नोटिस</h3>";
        if (!snap.exists()) {
            container.innerHTML += "<p style='text-align:center; color:#94a3b8;'>कोई नोटिस नहीं मिला।</p>";
            return;
        }

        let notices = [];
        snap.forEach(child => { 
            let val = child.val();
            notices.push({ id: child.key, ...val }); 
        });

        notices.reverse().forEach(n => {
            let fileHTML = n.fileData ? `<a href="${n.fileData}" target="_blank" class="attach-link">📎 फाइल देखें (${n.fileName})</a>` : "";
            
            // Clean strings for JS arguments
            const safeMsg = n.msg.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            
            container.innerHTML += `
                <div class="notice-item">
                    <div class="notice-date">📅 ${n.date}</div>
                    <div class="notice-msg">${n.msg}</div>
                    ${fileHTML}
                    <div class="actions">
                        <button class="edit-btn" onclick="editNotice('${n.id}', '${safeMsg}', '${n.fileData || ''}', '${n.fileName || ''}', '${n.date}', '${n.ts}')">📝 एडिट</button>
                        <button class="del-btn" onclick="deleteNotice('${n.id}')">🗑️ डिलीट</button>
                    </div>
                </div>`;
        });
    });
</script>
</body>
</html>
