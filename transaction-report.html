<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Entry Report | LAMPS Dhaurai</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { 
            --brand: #6366f1; 
            --primary: #0f172a; 
            --bg: #f8fafc; 
            --white: #ffffff;
            --border: #000000;
        }

        body { font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif; background: var(--bg); padding: 20px; color: var(--primary); }
        .container { max-width: 1300px; margin: 0 auto; }
        
        .card { background: var(--white); border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #ddd; margin-bottom: 20px; }
        
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: flex-end; }
        
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .btn-p { background: var(--brand); color: white; }
        .btn-s { background: #10b981; color: white; margin-left: 10px; }

        .action-btn { border: none; background: none; cursor: pointer; font-size: 14px; margin: 0 2px; padding: 5px; }
        .edit-btn { color: #2563eb; }
        .del-btn { color: #dc2626; }

        .report-section { display: none; margin-top: 30px; }
        .report-section.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border: 1.5px solid var(--border); }
        th { background: #ffffff; padding: 10px; border: 1px solid var(--border); text-align: center; font-size: 11px; color: black; font-weight: bold; }
        td { padding: 4px 8px; border: 1px solid var(--border); text-align: center; font-size: 12px; color: black; }
        
        .no-bottom-border { border-bottom: none !important; }
        .no-top-border { border-top: none !important; }

        .opening-row { background: #f2f2f2; font-weight: bold; }
        .total-row { background: #eeeeee; font-weight: bold; border-top: 2px solid #000; }
        .closing-row { background: #ffffff; font-weight: bold; border-top: 1px solid #000; }
        .text-left { text-align: left; padding-left: 10px; }
        .amt-text { text-align: right; padding-right: 10px; font-weight: 600; }
        
        .dr-text { font-weight: bold; padding-top: 8px; }
        .cr-text { padding-left: 25px; font-style: italic; padding-bottom: 8px; }
        .narration { font-size: 10px; color: #555; display: block; padding-left: 10px; margin-top: 2px; }

        @media print {
            .no-print { display: none !important; }
            .card { box-shadow: none; border: none; padding: 0; }
            body { background: white; padding: 0; }
            table { width: 100%; border: 1.5px solid #000; }
            th, td { border: 1px solid #000 !important; color: black; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card no-print">
        <h3>📊 डबल एंट्री ट्रांजेक्शन रिपोर्ट (Voucher Only)</h3>
        <div class="filter-grid">
            <div><label>से (From Date)</label><input type="date" id="from-date"></div>
            <div><label>तक (To Date)</label><input type="date" id="to-date"></div>
            <div>
                <label>रिपोर्ट प्रकार</label>
                <select id="report-type">
                    <option value="DAYBOOK">डे-बुक (Day Book)</option>
                    <option value="CASHBOOK">कैश-बुक (Cash Book)</option>
                    <option value="RECEIPT">प्राप्ति रिपोर्ट (Receipt)</option>
                    <option value="PAYMENT">भुगतान रिपोर्ट (Payment)</option>
                    <option value="JOURNAL">जर्नल रिपोर्ट (Journal)</option>
                </select>
            </div>
            <div><label>प्रारंभिक शेष</label><input type="number" id="opening-bal" value="0" step="0.01"></div>
            <div style="display:flex; gap:5px;">
                <button class="btn btn-p" onclick="generateReport()">Generate</button>
                <button class="btn btn-s" onclick="window.print()">Print</button>
            </div>
        </div>
    </div>

    <div id="report-content" class="card report-section">
        <div style="text-align: center; margin-bottom: 10px;">
            <h2 id="out-title" style="margin:0; text-decoration: underline;">REPORT</h2>
            <p id="out-period" style="margin:5px 0; font-weight: bold;"></p>
        </div>

        <table>
            <thead>
                <tr>
                    <th width="10%">Recording<br>Date</th>
                    <th width="8%">Voucher<br>No.</th>
                    <th width="35%">Particulars (खाता विवरण)</th>
                    <th width="10%">Type</th>
                    <th width="11%">Debit<br>(+)</th>
                    <th width="11%">Credit<br>(-)</th>
                    <th width="11%">Balance</th>
                    <th width="4%">Action</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
            <tfoot id="table-foot"></tfoot>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://societydb-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('from-date').value = today;
    document.getElementById('to-date').value = today;

    async function generateReport() {
        const from = document.getElementById('from-date').value;
        const to = document.getElementById('to-date').value;
        const type = document.getElementById('report-type').value;
        const openingBal = parseFloat(document.getElementById('opening-bal').value) || 0;

        swal({ title: "डेटा जनरेट हो रहा है...", icon: "info", buttons: false });

        const snap = await db.ref('lamps/vouchers').once('value');
        if(!snap.exists()) {
            swal.close();
            return swal("No Data", "वाउचर रिकॉर्ड नहीं मिला", "info");
        }

        const allVouchers = [];
        snap.forEach(child => {
            allVouchers.push({ key: child.key, ...child.val() });
        });
        allVouchers.sort((a,b) => new Date(a.date) - new Date(b.date));

        renderDoubleEntryTable(allVouchers, from, to, type, openingBal);
        swal.close();
    }

    function renderDoubleEntryTable(data, from, to, type, openingBal) {
        const body = document.getElementById('table-body');
        const foot = document.getElementById('table-foot');
        document.getElementById('report-content').classList.add('active');
        
        document.getElementById('out-title').innerText = document.getElementById('report-type').options[document.getElementById('report-type').selectedIndex].text;
        document.getElementById('out-period').innerText = `Period: ${from} To ${to}`;
        
        body.innerHTML = "";
        foot.innerHTML = "";
        
        let currentBal = openingBal;
        let totalDr = 0;
        let totalCr = 0;

        // Opening Row
        body.innerHTML += `
            <tr class="opening-row">
                <td></td><td></td>
                <td class="text-left">OPENING BALANCE</td>
                <td></td><td></td><td></td>
                <td class="amt-text">${openingBal.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
                <td></td>
            </tr>`;

        data.forEach((v, index) => {
            if(v.date >= from && v.date <= to) {
                if (type !== "DAYBOOK" && type !== "CASHBOOK" && v.type !== type) return;
                
                v.entries.forEach(e => {
                    let showRow = true;
                    if (type === "CASHBOOK") {
                        if (e.dr !== "नगद खाता" && e.cr !== "नगद खाता") showRow = false;
                    }

                    if(showRow) {
                        // Balance Logic (Asset specific: Cash)
                        if(e.dr === "नगद खाता") currentBal += e.amt;
                        if(e.cr === "नगद खाता") currentBal -= e.amt;
                        
                        // Accumulate only visible transaction amounts for totals
                        totalDr += e.amt;
                        totalCr += e.amt;

                        body.innerHTML += `
                            <tr>
                                <td rowspan="2" class="no-bottom-border" style="vertical-align:top; padding-top:10px;">${v.date}</td>
                                <td rowspan="2" class="no-bottom-border" style="vertical-align:top; padding-top:10px;">${v.vNo || (index + 1)}</td>
                                <td class="text-left dr-text no-bottom-border">${e.dr}</td>
                                <td rowspan="2" class="no-bottom-border" style="vertical-align:top; padding-top:10px;">${v.type}</td>
                                <td class="amt-text no-bottom-border">${e.amt.toFixed(2)}</td>
                                <td class="no-bottom-border"></td>
                                <td rowspan="2" class="no-bottom-border amt-text" style="vertical-align:top; padding-top:10px;">${currentBal.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
                                <td rowspan="2" class="no-bottom-border no-print" style="vertical-align:top; padding-top:10px;">
                                    <button class="action-btn edit-btn" title="Edit" onclick="editVoucher('${v.key}')">✏️</button>
                                    <button class="action-btn del-btn" title="Delete" onclick="deleteVoucher('${v.key}')">🗑️</button>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-left cr-text no-top-border">To ${e.cr}
                                    ${v.mainDesc ? `<span class="narration">(${v.mainDesc})</span>` : ''}
                                </td>
                                <td class="no-top-border"></td>
                                <td class="amt-text no-top-border">${e.amt.toFixed(2)}</td>
                            </tr>`;
                    }
                });
            }
        });

        // Calculations for TFoot
        const grandTotalDr = openingBal + totalDr;
        const grandTotalCr = totalCr + currentBal;

        foot.innerHTML = `
            <tr class="total-row">
                <td colspan="4" style="text-align: right; padding-right: 15px;">GRAND TOTAL</td>
                <td class="amt-text">${totalDr.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
                <td class="amt-text">${totalCr.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
                <td colspan="2"></td>
            </tr>
            <tr class="closing-row">
                <td colspan="6" style="text-align: right; padding-right: 15px;">CLOSING BALANCE (अंतिम शेष)</td>
                <td class="amt-text">${currentBal.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
                <td></td>
            </tr>`;
    }

    function editVoucher(key) {
        swal("Edit", "Voucher ID: " + key, "info");
    }

    function deleteVoucher(key) {
        swal({
            title: "डिलीट करें?",
            text: "क्या आप वाकई इस रिकॉर्ड को हटाना चाहते हैं?",
            icon: "warning",
            buttons: ["नहीं", "हाँ"],
            dangerMode: true,
        }).then((willDelete) => {
            if (willDelete) {
                db.ref('lamps/vouchers/' + key).remove().then(() => {
                    swal("सफलता", "रिकॉर्ड डिलीट हो गया", "success");
                    generateReport();
                });
            }
        });
    }
</script>
</body>
</html>
