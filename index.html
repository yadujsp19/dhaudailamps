<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लैम्प्स धौड़ाई - एडमिन सिस्टम</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>

    <style>
        :root { --primary: #0f172a; --accent: #6366f1; --bg: #f1f5f9; --sidebar-w: 260px; }
        * { box-sizing: border-box; font-family: 'Noto Sans Devanagari', sans-serif; }
        body { margin: 0; background: var(--bg); overflow: hidden; }

        #login-screen {
            position: fixed; inset: 0; background: var(--primary);
            display: flex; align-items: center; justify-content: center; z-index: 999;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 20px; width: 350px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .login-box input {
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px;
        }
        .login-btn {
            width: 100%; padding: 12px; background: var(--accent); color: white; border: none;
            border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
        .login-btn:disabled { background: #94a3b8; }

        #dashboard-view { display: none; height: 100vh; width: 100%; }
        .sidebar { width: var(--sidebar-w); background: var(--primary); color: white; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .sidebar h2 { text-align: center; color: var(--accent); border-bottom: 1px solid #334155; padding-bottom: 15px; font-size: 20px; }
        
        .nav-item {
            padding: 12px 15px; margin: 5px 0; border-radius: 8px; color: #94a3b8;
            cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 10px; font-size: 14px;
        }
        .nav-item:hover, .nav-item.active { background: #1e293b; color: white; }
        .nav-item.active { background: var(--accent); }

        .main-content { flex: 1; border: none; display: flex; flex-direction: column; }
        .top-bar { height: 60px; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        #content-frame { flex: 1; border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>लैम्प्स लॉगिन</h2>
            <p style="font-size: 12px; color: #64748b;">Firebase Secure Login</p>
            <input type="email" id="email" placeholder="ईमेल आईडी (Email)">
            <input type="password" id="password" placeholder="पासवर्ड">
            <button class="login-btn" id="loginBtn" onclick="checkLogin()">लॉगिन करें</button>
        </div>
    </div>

    <div id="dashboard-view">
        <div class="sidebar">
            <h2>LAMPS धौड़ाई</h2>
            <div class="nav-item active" onclick="changeTab(this, 'user_mgmt.html')">⚙️ यूजर मैनेजमेंट</div>
            <div class="nav-item" onclick="changeTab(this, 'kisan_reg.html')">👥 किसान पंजीकरण</div>
            <div class="nav-item" onclick="changeTab(this, 'loan_mgmt.html')">💰 ऋण प्रबंधन</div>
            <div class="nav-item" onclick="changeTab(this, 'loan_print.html')">🖨️ ऋण प्रिंट (PDF)</div>
            <div class="nav-item" onclick="changeTab(this, 'loan_disbursement_report.html')">📋 ऋण आहरण पत्रक</div>
            <div class="nav-item" onclick="changeTab(this, 'report.html')">📂 रिपोर्ट्स आर्काइव</div>
            <div class="nav-item" onclick="changeTab(this, 'bank_list.html')">🏦 बैंक लिस्ट</div>
            <div class="nav-item" onclick="changeTab(this, 'fertilizer.html')">📦 खाद एवं बीज</div>
            <div class="nav-item" onclick="changeTab(this, 'transactions.html')">📊 ट्रांजेक्शन</div>
            <div class="nav-item" onclick="changeTab(this, 'upload.html')">📤 डेटा अपलोड</div>
            
            <button onclick="logout()" style="margin-top: 20px; background: none; border: 1px solid #f43f5e; color: #f43f5e; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold;">निकास (Logout)</button>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <b id="tab-title">यूजर मैनेजमेंट</b>
                <div>
                    <span id="user-email" style="margin-right:15px; font-size:12px; color:var(--accent);"></span>
                    <span id="cur-date" style="color: #64748b; font-size: 14px;"></span>
                </div>
            </div>
            <iframe id="content-frame" src="about:blank"></iframe>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCp3N3FWECu-i4huDcWqn4RsQvThpbQjHo",
            authDomain: "societydb.firebaseapp.com",
            databaseURL: "https://societydb-default-rtdb.firebaseio.com",
            projectId: "societydb",
            storageBucket: "societydb.firebasestorage.app",
            messagingSenderId: "1016342848711",
            appId: "1:1016342848711:web:f5f804f5c89f86ab040ae2"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // लॉगिन चेक करने का फंक्शन
        function checkLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if(!email || !password) {
                swal("अधूरा डेटा", "कृपया ईमेल और पासवर्ड भरें", "warning");
                return;
            }

            btn.disabled = true;
            btn.innerText = "जाँच हो रही है...";

            auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                // Success
            })
            .catch((error) => {
                btn.disabled = false;
                btn.innerText = "लॉगिन करें";
                swal("लॉगिन विफल", "गलत ईमेल या पासवर्ड!", "error");
            });
        }

        // ऑथेंटिकेशन स्टेट मॉनिटर
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-view').style.display = 'flex';
                document.getElementById('user-email').innerText = user.email;
                
                // डिफॉल्ट टैब लोड करें
                const activeItem = document.querySelector('.nav-item.active');
                if(activeItem) {
                    const defaultFile = activeItem.getAttribute('onclick').split("'")[3];
                    changeTab(activeItem, defaultFile);
                }
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('dashboard-view').style.display = 'none';
            }
        });

        // टैब बदलने का फंक्शन
        function changeTab(element, fileName) {
            document.getElementById('content-frame').src = fileName;
            document.getElementById('tab-title').innerText = element.innerText.replace(/[^\w\s\u0900-\u097F]/g, '').trim();
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }

        // लॉगआउट फंक्शन
        function logout() {
            auth.signOut().then(() => {
                location.reload();
            });
        }

        // वर्तमान तारीख दिखाएँ
        document.getElementById('cur-date').innerText = new Date().toLocaleDateString('hi-IN');
    </script>

</body>
</html>
