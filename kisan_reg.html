<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Kisan Panjiyan | LAMPS Dhoudai</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { 
            /* Theme Colors Applied */
            --brand: #7C3AED;      /* Deep Purple */
            --brand-hover: #6D28D9;
            --brand-light: #F3E8FF; /* Light Lavender */
            --pink-accent: #EC4899; /* Pink Accent */
            --primary: #6B21A8;    /* Title Purple */
            --secondary: #64748b;
            --bg: #FAF5FF;         /* Main Page BG */
            --white: #ffffff;
            --border: #E9D5FF;     /* Purple Border */
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif; 
            background: var(--bg); 
            padding: 20px; 
            color: #111827;
            line-height: 1.6;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        /* Header Card with Dashboard Gradient */
        .header-card {
            background: linear-gradient(135deg, #6D28D9, #EC4899);
            color: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
        }

        .header-card h2 { font-size: 28px; margin-bottom: 5px; letter-spacing: -0.5px; }
        .header-card p { opacity: 0.9; font-size: 14px; }

        /* Main Form Card */
        .card { 
            background: var(--white); 
            border-radius: 16px; 
            padding: 30px; 
            margin-bottom: 25px; 
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        h4 { 
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--brand-light); 
            color: var(--primary);
            padding: 12px 18px; 
            border-radius: 10px; 
            margin: 35px 0 20px; 
            font-size: 15px; 
            font-weight: 700;
        }
        h4::before { content: ''; width: 4px; height: 18px; background: var(--pink-accent); border-radius: 4px; }

        /* Modern Search Area */
        .search-container {
            background: var(--bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px dashed var(--brand);
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
        }

        .search-container input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .btn-search {
            background: var(--brand);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-search:hover { background: var(--primary); }

        /* Grid Layout */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 20px; 
        }

        .field { margin-bottom: 5px; }
        .field label { 
            display: block; 
            font-size: 13px; 
            font-weight: 600; 
            color: var(--primary); 
            margin-bottom: 6px; 
        }

        input, select { 
            width: 100%; 
            padding: 11px 14px; 
            border: 1.5px solid var(--border); 
            border-radius: 8px; 
            font-size: 14px; 
            background: #fff; 
            transition: 0.2s;
        }

        input:focus, select:focus { 
            border-color: var(--pink-accent); 
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1); 
            outline: none;
        }

        input[readonly] { background: var(--bg); cursor: not-allowed; }

        .other-input { margin-top: 10px; border-style: dashed; border-color: var(--pink-accent); display: none; background: #fff; }

        /* Save Button */
        .btn-save { 
            background: var(--pink-accent); 
            color: white; 
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 40px; 
            font-size: 16px; 
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.2);
            transition: 0.3s;
        }
        .btn-save:hover { background: #DB2777; transform: translateY(-1px); }

        /* Table Design */
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-wrap { 
            overflow-x: auto; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            max-height: 600px;
        }

        table { width: 100%; border-collapse: collapse; min-width: 1400px; background: white; }
        
        th { 
            background: var(--bg-light); 
            padding: 14px; 
            text-align: left; 
            font-size: 12px; 
            font-weight: 700; 
            color: var(--primary); 
            text-transform: uppercase;
            border-bottom: 2px solid var(--border);
            position: sticky; top: 0; z-index: 10;
        }

        td { padding: 14px; border-bottom: 1px solid var(--bg); font-size: 13.5px; }

        tr:nth-child(even) { background: var(--bg); }
        tr:hover { background: var(--bg-light); }

        /* Action Icons */
        .action-btns { display: flex; gap: 6px; }
        .act-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .edit-icon { background: var(--bg-light); color: var(--brand); }
        .down-icon { background: #ecfdf5; color: #059669; }
        .del-icon { background: #fef2f2; color: #dc2626; }

        .btn-full-down {
            background: var(--brand);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .container { padding: 10px; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header-card">
        <h2>🚜 किसान पंजीयन पोर्टल</h2>
        <p>LAMPS धौड़ाई - सहकारी समिति प्रबंधन प्रणाली</p>
    </div>

    <div class="card">
        <div class="search-container">
            <input type="text" id="search_acc_input" placeholder="बैंक खाता नंबर डालकर खोजें...">
            <button class="btn-search" onclick="searchFarmer()">🔍 Search Record</button>
        </div>

        <div class="grid">
            <div class="field"><label>पंजीयन दिनांक</label><input type="date" id="reg_date"></div>
            <div class="field"><label>सदस्यता क्रमांक</label><input type="text" id="membership_id" placeholder="ID Number"></div>
        </div>

        <h4>1. किसान की व्यक्तिगत जानकारी</h4>
        <div class="grid">
            <div class="field"><label>बैंक खाता नंबर *</label><input type="text" id="k_acc" placeholder="Account No."></div>
            <div class="field"><label>किसान का नाम *</label><input type="text" id="k_name" placeholder="Farmer Name"></div>
            <div class="field"><label>पिता का नाम</label><input type="text" id="k_fname" placeholder="Father Name"></div>
            <div class="field"><label>जन्मतिथि</label><input type="date" id="k_dob"></div>
            <div class="field">
                <label>ग्राम *</label>
                <select id="k_vill" onchange="toggleOther(this, 'other_vill_box')">
                    <option value="धौड़ाई">धौड़ाई</option><option value="तारागांव">तारागांव</option>
                    <option value="बडगांव">बडगांव</option><option value="कन्हारगांव">कन्हारगांव</option>
                    <option value="टेमरूगाँव">टेमरूगाँव</option><option value="पल्ली">पल्ली</option>
                    <option value="छोटेकुम्हारी">छोटेकुम्हारी</option><option value="Other">अन्य...</option>
                </select>
                <input type="text" id="other_vill_box" class="other-input" placeholder="नया ग्राम लिखें">
            </div>
            <div class="field">
                <label>जाति</label>
                <select id="k_caste" onchange="toggleOther(this, 'other_caste_box')">
                    <option value="गोंड">गोंड</option><option value="हल्बा">हल्बा</option>
                    <option value="कलार">कलार</option><option value="मरार">मरार</option>
                    <option value="गांडा">गांडा</option><option value="पनका">पनका</option>
                    <option value="अहीर">अहीर</option><option value="रावत">रावत</option><option value="Other">अन्य...</option>
                </select>
                <input type="text" id="other_caste_box" class="other-input" placeholder="नई जाति लिखें">
            </div>
            <div class="field"><label>वर्ग</label><select id="k_cat"><option>ST</option><option>SC</option><option>OBC</option><option>GEN</option></select></div>
            <div class="field"><label>आधार नंबर</label><input type="text" id="k_aadhar" placeholder="[Aadhaar Omitted]"></div>
            <div class="field"><label>मोबाइल नंबर</label><input type="number" id="k_mob" placeholder="Mobile"></div>
        </div>

        <h4>2. भूमि की जानकारी</h4>
        <div class="grid">
            <div class="field"><label>एग्रीस्टैक आईडी</label><input type="text" id="k_agri" placeholder="ID"></div>
            <div class="field"><label>भूमि प्रकार</label><select id="k_land_type"><option>राजस्व</option><option>वन पट्टा</option></select></div>
            <div class="field"><label>कुल भूमि (हेक्टेयर)</label><input type="number" step="0.01" id="k_total_land" placeholder="0.00"></div>
            <div class="field"><label>कुल खसरा नंबर</label><input type="text" id="k_khasra" placeholder="Khasra"></div>
            <div class="field"><label>धान का रकबा</label><input type="number" step="0.01" id="k_paddy_area" placeholder="0.00"></div>
            <div class="field"><label>धान का खसरा</label><input type="text" id="k_paddy_khasra" placeholder="Paddy Khasra"></div>
            <div class="field"><label>अन्य फसल का रकबा</label><input type="number" step="0.01" id="k_other_area" placeholder="0.00"></div>
            <div class="field"><label>अन्य फसल का खसरा</label><input type="text" id="k_other_khasra" placeholder="Other Khasra"></div>
        </div>

        <h4>3. नॉमिनी की जानकारी</h4>
        <div class="grid">
            <div class="field"><label>नॉमिनी का नाम</label><input type="text" id="n_name" placeholder="Nominee Name"></div>
            <div class="field"><label>किसान से संबंध</label><input type="text" id="n_rel" placeholder="Relation"></div>
            <div class="field"><label>नॉमिनी आधार</label><input type="text" id="n_aadhar" placeholder="[Aadhaar Redacted]"></div>
            <div class="field"><label>नॉमिनी मोबाइल</label><input type="number" id="n_mob" placeholder="Nominee Mobile"></div>
        </div>

        <button class="btn-save" id="save-btn" onclick="validateAndSave()">💾 सुरक्षित करें (Save Farmer Data)</button>
    </div>

    <div class="card">
        <div class="table-header">
            <h3>📋 पंजीकृत डेटाबेस</h3>
            <button class="btn-full-down" onclick="downloadExcel()">📊 Export Full Excel</button>
        </div>
        <div class="table-wrap">
            <table id="farmerMainTable">
                <thead>
                    <tr>
                        <th>Date</th><th>ID</th><th>Account</th><th>Name</th><th>Father</th><th>DOB</th><th>Village</th><th>Caste</th><th>Cat</th><th>Aadhar</th><th>Mobile</th><th>AgriID</th><th>Land</th><th>Paddy</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="farmerTableBody"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const firebaseConfig = { databaseURL: "https://societydb-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    document.getElementById('reg_date').valueAsDate = new Date();

    function toggleOther(select, boxId) { 
        document.getElementById(boxId).style.display = (select.value === "Other") ? "block" : "none"; 
    }

    function searchFarmer() {
        const acc = document.getElementById('search_acc_input').value.trim();
        if(!acc) return swal("Oops", "खाता नंबर डालें", "info");
        
        db.ref('lamps/farmers/' + acc).once('value', snap => {
            if(snap.exists()) { 
                editFarmer(acc); 
                swal("मिल गया!", "किसान का डेटा फॉर्म में लोड हो गया है।", "success"); 
            }
            else { swal("नहीं मिला", "यह खाता नंबर डेटाबेस में नहीं है", "error"); }
        });
    }

    function validateAndSave() {
        const acc = document.getElementById('k_acc').value.trim();
        const name = document.getElementById('k_name').value.trim();
        
        if(!acc || !name) return swal("Error", "खाता नंबर और नाम अनिवार्य है", "warning");
        
        let vill = (document.getElementById('k_vill').value === "Other") ? document.getElementById('other_vill_box').value : document.getElementById('k_vill').value;
        let caste = (document.getElementById('k_caste').value === "Other") ? document.getElementById('other_caste_box').value : document.getElementById('k_caste').value;

        const payload = {
            reg_date: document.getElementById('reg_date').value,
            membership_id: document.getElementById('membership_id').value,
            acc: acc, name: name,
            fname: document.getElementById('k_fname').value, 
            dob: document.getElementById('k_dob').value,
            vill: vill, caste: caste, 
            cat: document.getElementById('k_cat').value,
            aadhar: document.getElementById('k_aadhar').value, 
            mob: document.getElementById('k_mob').value,
            agri: document.getElementById('k_agri').value, 
            land_type: document.getElementById('k_land_type').value,
            land_total: document.getElementById('k_total_land').value, 
            khasra: document.getElementById('k_khasra').value,
            paddy_area: document.getElementById('k_paddy_area').value, 
            paddy_khasra: document.getElementById('k_paddy_khasra').value,
            other_area: document.getElementById('k_other_area').value, 
            other_khasra: document.getElementById('k_other_khasra').value,
            n_name: document.getElementById('n_name').value, 
            n_rel: document.getElementById('n_rel').value,
            n_aadhar: document.getElementById('n_aadhar').value, 
            n_mob: document.getElementById('n_mob').value
        };

        db.ref('lamps/farmers/' + acc).set(payload).then(() => {
            swal("सफलता", "डेटा सुरक्षित कर लिया गया है", "success");
            resetForm();
        }).catch(err => {
            swal("Error", "डेटा सेव नहीं हुआ: " + err.message, "error");
        });
    }

    db.ref('lamps/farmers').on('value', snap => {
        const body = document.getElementById('farmerTableBody');
        body.innerHTML = "";
        snap.forEach(child => {
            const d = child.val();
            body.innerHTML += `<tr>
                <td>${d.reg_date}</td><td>${d.membership_id}</td><td><b>${d.acc}</b></td><td>${d.name}</td><td>${d.fname}</td><td>${d.dob}</td><td>${d.vill}</td><td>${d.caste}</td><td>${d.cat}</td><td>${d.aadhar}</td><td>${d.mob}</td><td>${d.agri}</td><td>${d.land_total}</td><td>${d.paddy_area}</td>
                <td class="action-btns">
                    <button class="act-icon edit-icon" onclick="editFarmer('${d.acc}')" title="Edit">✏️</button>
                    <button class="act-icon down-icon" onclick="downloadSingleExcel('${d.acc}')" title="Download XLS">📥</button>
                    <button class="act-icon del-icon" onclick="deleteFarmer('${d.acc}')" title="Delete">🗑️</button>
                </td>
            </tr>`;
        });
    });

    function editFarmer(acc) {
        db.ref('lamps/farmers/' + acc).once('value', snap => {
            const d = snap.val();
            document.getElementById('k_acc').value = d.acc;
            document.getElementById('k_acc').readOnly = true;
            document.getElementById('reg_date').value = d.reg_date;
            document.getElementById('membership_id').value = d.membership_id;
            document.getElementById('k_name').value = d.name;
            document.getElementById('k_fname').value = d.fname;
            document.getElementById('k_dob').value = d.dob;
            document.getElementById('k_cat').value = d.cat;
            document.getElementById('k_aadhar').value = d.aadhar;
            document.getElementById('k_mob').value = d.mob;
            document.getElementById('k_agri').value = d.agri;
            document.getElementById('k_land_type').value = d.land_type;
            document.getElementById('k_total_land').value = d.land_total;
            document.getElementById('k_khasra').value = d.khasra;
            document.getElementById('k_paddy_area').value = d.paddy_area;
            document.getElementById('k_paddy_khasra').value = d.paddy_khasra;
            document.getElementById('k_other_area').value = d.other_area;
            document.getElementById('k_other_khasra').value = d.other_khasra;
            document.getElementById('n_name').value = d.n_name;
            document.getElementById('n_rel').value = d.n_rel;
            document.getElementById('n_aadhar').value = d.n_aadhar;
            document.getElementById('n_mob').value = d.n_mob;
            
            document.getElementById('save-btn').innerText = "🆙 डेटा अपडेट करें (Update Data)";
            document.getElementById('save-btn').style.background = "#7C3AED";
            window.scrollTo({top: 0, behavior: 'smooth'});
        });
    }

    function deleteFarmer(id) {
        swal({ 
            title: "डेटा मिटाएं?", 
            text: "क्या आप वाकई इस किसान का रिकॉर्ड मिटाना चाहते हैं?",
            icon: "warning", 
            buttons: ["नहीं", "हाँ, मिटाएं"], 
            dangerMode: true 
        }).then(willDelete => { 
            if(willDelete) {
                db.ref('lamps/farmers/' + id).remove().then(() => {
                    swal("Deleted!", "रिकॉर्ड मिटा दिया गया है", "success");
                });
            }
        });
    }

    function downloadSingleExcel(acc) {
        db.ref('lamps/farmers/' + acc).once('value', snap => {
            const data = [snap.val()];
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Farmer");
            XLSX.writeFile(wb, `Farmer_${acc}.xlsx`);
        });
    }

    function downloadExcel() {
        const table = document.getElementById("farmerMainTable");
        const wb = XLSX.utils.table_to_book(table, {sheet: "KisanDatabase"});
        XLSX.writeFile(wb, "LAMPS_Dhaurai_Kisan_List.xlsx");
    }

    function resetForm() {
        document.querySelectorAll('.card input').forEach(i => i.value = "");
        document.getElementById('k_acc').readOnly = false;
        document.getElementById('reg_date').valueAsDate = new Date();
        document.getElementById('save-btn').innerText = "💾 सुरक्षित करें (Save Farmer Data)";
        document.getElementById('save-btn').style.background = "#EC4899";
    }
</script>
</body>
</html>
