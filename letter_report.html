<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Archive Report | LAMPS Dhoudai</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #7b2cbf;
            --secondary: #d00067;
            --bg: #f4f7fe;
            --text-muted: #718096;
        }
        body { font-family: 'Inter', 'Noto Sans Devanagari', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        .report-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .report-header h2 { margin: 0; color: #1a365d; display: flex; align-items: center; gap: 10px; font-size: 22px; }

        .filters { display: flex; gap: 10px; flex-wrap: wrap; }
        
        .search-box { position: relative; width: 280px; }
        .search-box input { width: 100%; padding: 12px 40px 12px 15px; border: 1px solid #e2e8f0; border-radius: 12px; outline: none; transition: 0.3s; font-size: 14px; }
        .search-box i { position: absolute; right: 15px; top: 15px; color: #a0aec0; }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(123, 44, 191, 0.1); }

        .date-filter { padding: 10px; border: 1px solid #e2e8f0; border-radius: 12px; outline: none; font-size: 14px; color: #4a5568; }

        /* Table Style */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 800px; }
        th { background: #f8fafc; color: #4a5568; font-weight: 700; text-align: left; padding: 15px; border-bottom: 2px solid #edf2f7; text-transform: uppercase; font-size: 13px; }
        td { padding: 15px; border-bottom: 1px solid #edf2f7; font-size: 14px; color: #2d3748; vertical-align: top; }
        tr:hover { background: #fdf2f8; transition: 0.2s; }

        .badge { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; background: #e9d8fd; color: #553c9a; display: inline-block; white-space: nowrap; }
        .subject-text { font-weight: 600; color: #2d3748; display: block; margin-bottom: 4px; }
        .receiver-info { color: #718096; font-size: 13px; }
        
        .btn-view { padding: 8px 16px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: 0.3s; }
        .btn-view:hover { background: var(--secondary); transform: translateY(-1px); }

        #loader { text-align: center; padding: 60px; color: var(--text-muted); font-size: 18px; }

        @media print {
            .filters, .btn-view, .search-box { display: none !important; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; width: 100%; border: none; }
            th { background: #eee !important; color: black !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="report-header">
        <h2><i class="fa-solid fa-folder-open"></i> जावक पत्र रजिस्टर (Correspondence Archive)</h2>
        
        <div class="filters">
            <input type="date" id="dateFilter" class="date-filter" onchange="filterData()">
            
            <div class="search-box">
                <input type="text" id="searchInput" onkeyup="filterData()" placeholder="क्रमांक या विषय से खोजें...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            
            <button class="btn-view" style="background: #2d3748;" onclick="window.print()">
                <i class="fa-solid fa-print"></i> प्रिंट
            </button>
        </div>
    </div>

    <div id="loader">
        <i class="fa-solid fa-circle-notch fa-spin"></i> डेटा लोड हो रहा है, कृपया प्रतीक्षा करें...
    </div>

    <div class="table-responsive">
        <table id="reportTable" style="display: none;">
            <thead>
                <tr>
                    <th width="15%">जावक क्रमांक</th>
                    <th width="12%">दिनांक</th>
                    <th width="25%">प्रति (Receiver)</th>
                    <th width="35%">विषय (Subject)</th>
                    <th width="13%">कार्यवाही</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCp3N3FWECu-i4huDcWqn4RsQvThpbQjHo",
        authDomain: "societydb.firebaseapp.com",
        databaseURL: "https://societydb-default-rtdb.firebaseio.com",
        projectId: "societydb",
        storageBucket: "societydb.firebasestorage.app",
        messagingSenderId: "1016342848711",
        appId: "1:1016342848711:web:f5f804f5c89f86ab040ae2"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const tableBody = document.getElementById('tableBody');
    const loader = document.getElementById('loader');
    const table = document.getElementById('reportTable');

    // Global variable to store letters for client-side filtering
    let allLetters = [];

    // Fetch Data (Realtime)
    db.ref('outward_letters').on('value', (snapshot) => {
        allLetters = [];
        if (snapshot.exists()) {
            snapshot.forEach((childSnapshot) => {
                let data = childSnapshot.val();
                allLetters.push(data);
            });

            // Sort by Timestamp descending (Latest First)
            allLetters.sort((a, b) => b.timestamp - a.timestamp);
            
            displayData(allLetters);
            loader.style.display = "none";
            table.style.display = "table";
        } else {
            loader.innerHTML = "<i class='fa-solid fa-inbox'></i> कोई रिकॉर्ड नहीं मिला।";
        }
    }, (error) => {
        loader.innerHTML = "त्रुटि: डेटा लोड करने में विफल। " + error.message;
    });

    // Function to render table rows
    function displayData(dataArray) {
        tableBody.innerHTML = "";
        dataArray.forEach((data) => {
            const row = `
                <tr>
                    <td><span class="badge">${data.kramank || 'N/A'}</span></td>
                    <td><strong>${data.date || '---'}</strong></td>
                    <td class="receiver-info">${data.receiver || '---'}</td>
                    <td>
                        <span class="subject-text">${data.subject || 'No Subject'}</span>
                    </td>
                    <td>
                        <button class="btn-view" onclick="viewLetter('${data.kramank}')">
                            <i class="fa-solid fa-eye"></i> विवरण
                        </button>
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    // Unified Filter Function (Date + Search)
    function filterData() {
        const searchTerm = document.getElementById("searchInput").value.toLowerCase();
        const filterDate = document.getElementById("dateFilter").value; // Format: YYYY-MM-DD

        const filtered = allLetters.filter(item => {
            // Search logic (Subject or Kramank)
            const matchesSearch = (item.subject && item.subject.toLowerCase().includes(searchTerm)) || 
                                 (item.kramank && item.kramank.toLowerCase().includes(searchTerm));
            
            // Date logic
            // Note: If item.date is in DD/MM/YYYY, we need to handle comparison or ensure item has a standard date property
            let matchesDate = true;
            if (filterDate) {
                // Convert YYYY-MM-DD to DD/MM/YYYY for comparison (assuming your data stores as DD/MM/YYYY)
                const [y, m, d] = filterDate.split('-');
                const formattedFilterDate = `${d}/${m}/${y}`;
                matchesDate = (item.date === formattedFilterDate);
            }

            return matchesSearch && matchesDate;
        });

        displayData(filtered);
    }

    function viewLetter(kramank) {
        // Redirect to editor or viewer with the Kramank ID
        // encodeURIComponent handles slashes in ID
        window.location.href = `letter.html?edit=${encodeURIComponent(kramank)}`;
    }
</script>

</body>
</html>
